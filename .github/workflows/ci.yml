name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable
      - run: npm ci
      - name: Converter and page logic (node + jsdom)
        run: npm test
      - name: Three-way merge (headless nvim)
        run: nvim --headless -u NONE -l test/merge_spec.lua
      - name: Server, edits, file watching (headless nvim)
        run: nvim --headless -u NONE -l test/server_spec.lua
      - name: Vendored libraries match the pinned checksums
        run: cd vendor && shasum -a 256 -c SHA256SUMS
      - name: Lua syntax
        run: |
          for f in $(git ls-files '*.lua'); do nvim --headless -u NONE -c "lua assert(loadfile('$f'))" -c q || exit 1; done

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
