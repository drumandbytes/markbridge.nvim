name: Bug report
description: Something does not work as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: The markdown involved
      description: The smallest piece of markdown that shows the problem.
      render: markdown
  - type: input
    id: nvim
    attributes:
      label: Neovim version
      placeholder: "NVIM v0.12.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Firefox 140 on Fedora"
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: ":checkhealth markbridge"
      render: text
